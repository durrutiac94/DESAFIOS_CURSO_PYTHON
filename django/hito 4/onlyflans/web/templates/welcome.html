{% extends 'base.html' %}

{% block content %}

<div class="container">
  <h4 class="text-center">bienvenido {{user.get_username}} </h4>
  
</div>

<section>
<div class="container">
<div class="row row-cols-1 row-cols-md-4 ">
{% for flan in productos %}
  <div class="col">
    <img src="{{ flan.image_url }}" class="card-img-top" alt="..." style="height: 250px;">
    <div class="card-body">
      <h5 class="card-title">{{ flan.name}}</h5>
      <p class="card-text">{{ flan.description }}</p>
      <p class="card-text"><small class="text-body-secondary">Last updated 3 mins ago</small></p>
    </div>
  </div>
  {% endfor %}
</div>
</div>
</section>

{% endblock %}
