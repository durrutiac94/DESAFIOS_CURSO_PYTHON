{% extends 'base.html' %}
{% load static %}
{% block content %}

<section>
<div class="container">
<div class="row row-cols-1 row-cols-md-3 ">
{% for flan in productos %}
  <div class="col">
    <img src="{{flan.url}}" style="width: 300px; height: 200px;" class="card-img-top" alt="flanes">
    <div class="card-body">
      <h5 class="card-title">{{ flan.nombre}}</h5>
      <p class="card-text">{{ flan.descripcion }}</p>
    </div>
  </div>
  {% endfor %}
</div>
</div>
</section>

{% endblock %}
